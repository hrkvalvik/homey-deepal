<header class="homey-header">
  <h1 class="homey-title" data-i18n="pair.login.title"></h1>
  <p class="homey-subtitle" data-i18n="pair.login.subtitle"></p>
</header>

<form id="step-request" class="homey-form" onsubmit="return false">
  <div class="homey-form-group">
    <label class="homey-form-label" for="method" data-i18n="pair.login.method"></label>
    <select class="homey-form-select" id="method">
      <option value="email" selected data-i18n="pair.login.method_email"></option>
      <option value="sms" data-i18n="pair.login.method_sms"></option>
    </select>
  </div>
  <div class="homey-form-group" id="email-group">
    <label class="homey-form-label" for="email" data-i18n="pair.login.email"></label>
    <input class="homey-form-input" id="email" type="email" autocomplete="username" />
  </div>
  <div class="homey-form-group" id="phone-group" style="display:none">
    <label class="homey-form-label" for="dialCode" data-i18n="pair.login.dial_code"></label>
    <input class="homey-form-input" id="dialCode" type="text" inputmode="numeric" />
    <label class="homey-form-label" for="phone" data-i18n="pair.login.phone"></label>
    <input class="homey-form-input" id="phone" type="tel" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="country" data-i18n="pair.login.country"></label>
    <input class="homey-form-input" id="country" type="text" maxlength="2" value="GB" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="environment" data-i18n="pair.login.region"></label>
    <select class="homey-form-select" id="environment">
      <option value="release_eu" selected data-i18n="pair.login.region_eu"></option>
      <option value="release_znm" data-i18n="pair.login.region_latam"></option>
    </select>
  </div>
  <button class="homey-button-primary-full" id="request-button" data-i18n="pair.login.send_code"></button>
</form>

<form id="step-code" class="homey-form" style="display:none" onsubmit="return false">
  <div class="homey-form-group">
    <label class="homey-form-label" for="code" data-i18n="pair.login.code"></label>
    <input class="homey-form-input" id="code" type="text" inputmode="numeric" autocomplete="one-time-code" />
  </div>
  <button class="homey-button-primary-full" id="login-button" data-i18n="pair.login.login"></button>
  <button class="homey-button-transparent" id="back-button" data-i18n="pair.login.back"></button>
</form>

<script type="application/javascript">
  (async function () {
    const $ = id => document.getElementById(id);
    let mode = 'pair';

    try {
      const state = await Homey.emit('get_mode');
      mode = state.mode;
      if (mode === 'pair' && state.loggedIn) {
        Homey.showView('list_devices');
        return;
      }
    } catch (err) {
      // show the form
    }

    $('method').addEventListener('change', () => {
      const sms = $('method').value === 'sms';
      $('email-group').style.display = sms ? 'none' : '';
      $('phone-group').style.display = sms ? '' : 'none';
    });

    $('request-button').addEventListener('click', async () => {
      const button = $('request-button');
      button.classList.add('is-loading');
      try {
        await Homey.emit('request_code', {
          method: $('method').value,
          email: $('email').value.trim(),
          phone: $('phone').value.trim(),
          dialCode: $('dialCode').value.trim(),
          country: $('country').value.trim(),
          environment: $('environment').value,
        });
        $('step-request').style.display = 'none';
        $('step-code').style.display = '';
        $('code').focus();
      } catch (err) {
        Homey.alert(err.message || String(err), 'error');
      } finally {
        button.classList.remove('is-loading');
      }
    });

    $('back-button').addEventListener('click', () => {
      $('step-code').style.display = 'none';
      $('step-request').style.display = '';
    });

    $('login-button').addEventListener('click', async () => {
      const button = $('login-button');
      button.classList.add('is-loading');
      try {
        await Homey.emit('login', { code: $('code').value.trim() });
        if (mode === 'repair') Homey.done();
        else Homey.showView('list_devices');
      } catch (err) {
        Homey.alert(err.message || String(err), 'error');
      } finally {
        button.classList.remove('is-loading');
      }
    });
  })();
</script>
