<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: var(--homey-background-color, #ffffff);
    --text: var(--homey-text-color, #16202c);
    --muted: #6b7686;
    --line: rgba(22, 32, 44, 0.09);
    --surface: rgba(22, 32, 44, 0.045);
    --surface-press: rgba(22, 32, 44, 0.1);
    --accent: #2f7df6;
    --heat: #f0803c;
    --ok: #1f9d68;
    --warn: #e39b12;
    --danger: #e5484d;
    --body: #e4e8ef;
    --body-edge: #c9d0db;
    --glass: #a9b8cd;
    --glass-open: #e39b12;
    --wheel: #2b323d;
    --radius: 14px;
    --font: var(--homey-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.homey-light-mode) {
      --bg: var(--homey-background-color, #16191f);
      --text: var(--homey-text-color, #eef1f5);
      --muted: #8d97a6;
      --line: rgba(255, 255, 255, 0.08);
      --surface: rgba(255, 255, 255, 0.06);
      --surface-press: rgba(255, 255, 255, 0.13);
      --body: #2c333e;
      --body-edge: #424b59;
      --glass: #4a5a71;
      --wheel: #0d1014;
    }
  }
  html.homey-dark-mode {
    --bg: var(--homey-background-color, #16191f);
    --text: var(--homey-text-color, #eef1f5);
    --muted: #8d97a6;
    --line: rgba(255, 255, 255, 0.08);
    --surface: rgba(255, 255, 255, 0.06);
    --surface-press: rgba(255, 255, 255, 0.13);
    --body: #2c333e;
    --body-edge: #424b59;
    --glass: #4a5a71;
    --wheel: #0d1014;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { position: relative; padding: 14px 14px 12px; font-size: 13px; line-height: 1.3; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  button:disabled { cursor: default; }
  svg { display: block; }

  /* Header */
  .header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .title { min-width: 0; }
  .name { font-size: 16px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
  .name.switchable::after { content: ""; width: 6px; height: 6px; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translateY(-2px); margin-left: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .refresh { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); flex: none; }
  .refresh:active { background: var(--surface-press); }
  .refresh svg { width: 18px; height: 18px; }
  .refresh.busy svg { animation: spin 1s linear infinite; }

  .battery { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .battery-value { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
  .battery-value small { font-size: 14px; font-weight: 600; color: var(--muted); }
  .battery-detail { flex: 1; min-width: 0; }
  .bar { height: 6px; border-radius: 3px; background: var(--surface-press); overflow: hidden; }
  .bar > div { height: 100%; border-radius: 3px; background: var(--ok); transition: width .4s ease; }
  .bar.charging > div { background-image: linear-gradient(90deg, rgba(255,255,255,0) 0, rgba(255,255,255,.45) 50%, rgba(255,255,255,0) 100%); background-size: 60px 100%; background-repeat: no-repeat; animation: shimmer 1.6s linear infinite; background-color: var(--ok); }
  .bar.low > div { background-color: var(--danger); }
  .battery-text { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 5px; gap: 6px; }
  .battery-text .charging { color: var(--ok); font-weight: 600; }

  /* Car */
  .car-wrap { position: relative; margin: 10px -6px 6px; }
  .car-wrap > svg { width: 100%; height: auto; overflow: visible; }
  .part { cursor: pointer; transition: fill .25s ease, opacity .25s ease; }
  .part:active { opacity: .7; }
  .part.disabled { cursor: default; }
  .tire-label { font-size: 40px; font-weight: 600; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .tire-label.alarm { fill: var(--danger); }
  .state-label { font-size: 9.5px; font-weight: 700; letter-spacing: .4px; fill: var(--warn); text-transform: uppercase; }
  .cabin-glow { opacity: 0; transition: opacity .4s ease; }
  .climate-on .cabin-glow { opacity: 1; animation: breathe 3s ease-in-out infinite; }
  .lock-badge circle { transition: fill .25s ease; }
  .pending-ring { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-dasharray: 34 104; transform-origin: center; transform-box: fill-box; animation: spin 1s linear infinite; }
  .flash-beam { opacity: 0; }
  .flashing .flash-beam { animation: beam 0.9s ease-in-out 3; }

  .warnings { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 2px 0 8px; }
  .chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; background: rgba(229, 72, 77, .12); color: var(--danger); }
  .chip.info { background: rgba(227, 155, 18, .14); color: var(--warn); }

  /* Climate */
  .climate { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius); background: var(--surface); }
  .climate-toggle { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 6px; border-radius: 10px; flex: 1; min-width: 0; text-align: left; }
  .climate-toggle:active { background: var(--surface-press); }
  .climate-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-press); flex: none; transition: background .25s ease, color .25s ease; }
  .climate-icon svg { width: 20px; height: 20px; }
  .climate-on .climate-icon { background: var(--accent); color: #fff; }
  .climate-on.heating .climate-icon { background: var(--heat); }
  .climate-label { font-weight: 650; }
  .climate-sub { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .temp { display: flex; align-items: center; gap: 2px; flex: none; }
  .temp button { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font-size: 18px; font-weight: 500; }
  .temp button:active { background: var(--surface-press); }
  .temp-value { width: 52px; text-align: center; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* Seat and steering wheel heating */
  .comfort { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
  .comfort-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px 7px; border-radius: 12px; background: var(--surface); text-align: center; min-width: 0; transition: background .2s ease; }
  .comfort-btn:active:not(:disabled) { background: var(--surface-press); }
  .comfort-btn:disabled { opacity: .4; }
  .comfort-btn svg { width: 22px; height: 22px; flex: none; }
  .comfort-btn.on svg { color: var(--heat); }
  .comfort-btn.pending svg { animation: pulse 1s ease-in-out infinite; }
  .comfort-text { min-width: 0; max-width: 100%; display: flex; flex-direction: column; align-items: center; }
  .comfort-label { font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .levels { display: flex; gap: 3px; margin-top: 4px; height: 4px; }
  .levels i { width: 10px; height: 4px; border-radius: 2px; background: var(--surface-press); }
  .levels i.on { background: var(--heat); }
  .comfort-state { font-size: 10px; line-height: 10px; color: var(--muted); margin-top: 1px; display: block; }
  .comfort-btn.on .comfort-state { color: var(--heat); font-weight: 600; }

  /* Actions */
  .actions { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
  .action { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 2px 6px; border-radius: 12px; background: var(--surface); position: relative; transition: background .2s ease; }
  .action:active:not(:disabled) { background: var(--surface-press); }
  .action svg { width: 22px; height: 22px; }
  .action span { font-size: 10.5px; font-weight: 600; white-space: nowrap; }
  .action.on { color: var(--ok); }
  .action.alert { color: var(--warn); }
  .action.confirm { background: var(--accent); color: #fff; }
  .action:disabled { opacity: .4; }
  .action.pending svg { animation: pulse 1s ease-in-out infinite; }

  /* Overlay and toast */
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--bg); color: var(--muted); }
  .overlay strong { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
  .toast { position: fixed; left: 50%; bottom: 12px; transform: translate(-50%, 20px); opacity: 0; max-width: calc(100% - 28px); padding: 9px 14px; border-radius: 12px; background: #1d2530; color: #fff; font-size: 12.5px; font-weight: 500; text-align: center; pointer-events: none; transition: opacity .2s ease, transform .2s ease; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.error { background: var(--danger); }

  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .35; } }
  @keyframes breathe { 50% { opacity: .55; } }
  @keyframes beam { 0%, 100% { opacity: 0; } 40%, 60% { opacity: .9; } }
  @keyframes shimmer { from { background-position: -60px 0; } to { background-position: calc(100% + 60px) 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
  'use strict';

  // Norwegian texts; English is the fallback. Homey's language when known, else the browser's.
  const NO = {
    "Tap again to unlock": "Trykk igjen for å låse opp",
    "Tap again to open the trunk": "Trykk igjen for å åpne bagasjerommet",
    "Tap again to open the windows": "Trykk igjen for å åpne vinduene",
    "Tap again to close the windows": "Trykk igjen for å lukke vinduene",
    "Locked": "Låst",
    "Unlocked": "Låst opp",
    "Climate started": "Klima startet",
    "Climate stopped": "Klima stoppet",
    "Temperature set": "Temperatur satt",
    "Lights flashed": "Lysene blinket",
    "Horn sounded": "Hornet ble brukt",
    "Trunk opened": "Bagasjerom åpnet",
    "Windows opened": "Vinduer åpnet",
    "Windows closed": "Vinduer lukket",
    "Updated": "Oppdatert",
    "Driver seat heating set": "Setevarme fører satt",
    "Passenger seat heating set": "Setevarme passasjer satt",
    "Steering wheel heating on": "Rattvarme på",
    "Steering wheel heating off": "Rattvarme av",
    "Done": "Ferdig",
    "Command failed": "Kommandoen mislyktes",
    "Set the remote-control PIN in the device settings first": "Angi PIN-koden for fjernkontroll i enhetsinnstillingene først",
    "Wait for the current command to finish": "Vent til pågående kommando er ferdig",
    "No report yet": "Ingen rapport ennå",
    "Updated just now": "Oppdatert nå",
    "min": "min",
    "range": "rekkevidde",
    "left": "igjen",
    "Charging": "Lader",
    "Plugged in": "Koblet til",
    "Door open": "Dør åpen",
    "Window open": "Vindu åpent",
    "Unavailable": "Utilgjengelig",
    "Starting…": "Starter …",
    "Stopping…": "Stopper …",
    "Heating": "Varmer",
    "Cooling": "Kjøler",
    "Climate off": "Klima av",
    "Lower temperature": "Senk temperatur",
    "Raise temperature": "Øk temperatur",
    "Driver": "Fører",
    "Passenger": "Passasjer",
    "Steering wheel heating": "Rattvarme",
    "Wheel": "Ratt",
    "On": "På",
    "Off": "Av",
    "Lock": "Lås",
    "Unlock": "Lås opp",
    "Flash": "Blink",
    "Horn": "Horn",
    "Trunk": "Bagasje",
    "Close": "Lukk",
    "Windows": "Vinduer",
    "OPEN": "ÅPEN",
    "HOOD OPEN": "PANSER ÅPENT",
    "Flash the lights": "Blink med lysene",
    "Open the trunk": "Åpne bagasjerommet",
    "the car": "bilen",
    "Deepal S05, top view": "Deepal S05, sett ovenfra",
    "No car yet": "Ingen bil ennå",
    "Add your car under Devices → + → Changan Deepal (Unofficial).": "Legg til bilen under Enheter → + → Changan Deepal (Unofficial).",
    "Car unavailable": "Bilen er utilgjengelig",
    "The My Changan login expired or was signed out. Open the device and choose Repair to log in again.": "My Changan-innloggingen har utløpt eller ble logget ut. Åpne enheten og velg Reparer for å logge inn på nytt.",
    "Wake the car and refresh": "Vekk bilen og oppdater",
    "seat heating": "setevarme",
    "level": "nivå",
    "unknown": "ukjent"
  };
  let lang = null;
  function t(text) {
    if (lang === null) {
      let code = '';
      try { code = (typeof Homey.getLanguage === 'function' && Homey.getLanguage()) || ''; } catch (err) { /* optional */ }
      lang = String(code || navigator.language || 'en').slice(0, 2).toLowerCase();
    }
    return lang === 'nb' || lang === 'nn' || lang === 'no' ? NO[text] || text : text;
  }

  // Actions that move something on the car ask for a second tap.
  const CONFIRM = {
    unlock: 'Tap again to unlock',
    open_trunk: 'Tap again to open the trunk',
    windows_open: 'Tap again to open the windows',
    windows_close: 'Tap again to close the windows',
  };
  const PIN_ACTIONS = new Set(['lock', 'unlock', 'open_trunk', 'windows_open', 'windows_close']);
  const DONE = {
    lock: 'Locked', unlock: 'Unlocked', climate_on: 'Climate started', climate_off: 'Climate stopped',
    set_temperature: 'Temperature set', flash: 'Lights flashed', horn: 'Horn sounded', open_trunk: 'Trunk opened',
    windows_open: 'Windows opened', windows_close: 'Windows closed', refresh: 'Updated',
    seat_heat_driver: 'Driver seat heating set', seat_heat_passenger: 'Passenger seat heating set',
    steering_on: 'Steering wheel heating on', steering_off: 'Steering wheel heating off',
  };
  // Commands that may be adjusted while another one runs: the latest value wins.
  const ADJUSTABLE = new Set(['set_temperature', 'seat_heat_driver', 'seat_heat_passenger']);
  const COMMAND_TIMEOUT_MS = 120000;

  const ICONS = {
    lock: '<path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"/>',
    unlock: '<path d="M7 10V7a5 5 0 0 1 9.6-1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="5" y="10" width="14" height="11" rx="2.5" fill="currentColor"/>',
    flash: '<path d="M9 7.5a4.5 4.5 0 0 0 0 9h1.5v-9z" fill="currentColor"/><path d="M14 8h6M14 12h7M14 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    horn: '<path d="M4 10v4h3l6 4V6L7 10z" fill="currentColor"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    trunk: '<path d="M4 15h16v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" fill="currentColor"/><path d="M5 13l3-8h8l3 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 7v4m-2-2 2 2 2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
    window: '<path d="M5 20V9l6-5h8v16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M7 12h10" stroke="currentColor" stroke-width="2"/><path d="M12 15.5v3m-1.6-1.4L12 18.5l1.6-1.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>',
    fan: '<circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 10c0-3 .5-6 3-6s2.5 3 0 4.5zM14 12c3 0 6 .5 6 3s-3 2.5-4.5 0zM12 14c0 3-.5 6-3 6s-2.5-3 0-4.5zM10 12c-3 0-6-.5-6-3s3-2.5 4.5 0z" fill="currentColor"/>',
    refresh: '<path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
    bolt: '<path d="M13 2 5 13.5h6L10 22l8-11.5h-6z" fill="currentColor"/>',
    seat: '<path d="M6 3.5a1 1 0 0 1 1.2-.98l2 .4a1 1 0 0 1 .8.98V13h6a2 2 0 0 1 2 2v2H8a2 2 0 0 1-2-2zM7 19h11a1 1 0 0 1 0 2H7a1 1 0 0 1 0-2z" fill="currentColor"/><path d="M13.2 4.6c.5.6.5 1.2 0 1.8s-.5 1.2 0 1.8M16.2 4.6c.5.6.5 1.2 0 1.8s-.5 1.2 0 1.8M19.2 4.6c.5.6.5 1.2 0 1.8s-.5 1.2 0 1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
    wheel: '<path fill="currentColor" fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20Zm0 2a8 8 0 0 0-7.9 6.7l3.4-.6a4.6 4.6 0 0 1 9 0l3.4.6A8 8 0 0 0 12 4Zm-7.9 9.4a8 8 0 0 0 6.5 6.5l-.4-3.6a3.4 3.4 0 0 1-2.6-2.6Zm9.3 6.5a8 8 0 0 0 6.5-6.5l-3.5.3a3.4 3.4 0 0 1-2.6 2.6ZM12 11a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/>',
  };
  const icon = name => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[name]}</svg>`;

  let Homey = null;
  let cars = [];
  let selectedId = null;
  let localTemp = null;
  let tempTimer = null;
  const localSeat = { driver: null, passenger: null };
  const seatTimers = { driver: null, passenger: null };
  let confirm = null;
  let flashing = false;
  const pending = new Map(); // `${carId}:${action}` -> timeout id

  // --- Data ----------------------------------------------------------------------

  async function load() {
    try {
      cars = await Homey.api('GET', '/state');
      if (!cars.some(car => car.carId === selectedId)) selectedId = cars.length ? cars[0].carId : null;
      render();
    } catch (err) {
      showToast(err.message || String(err), true);
    }
  }

  function car() {
    return cars.find(c => c.carId === selectedId) || null;
  }

  function isPending(action) {
    return pending.has(`${selectedId}:${action}`);
  }

  function anyPending() {
    for (const key of pending.keys()) if (key.startsWith(`${selectedId}:`)) return true;
    return false;
  }

  // --- Commands -------------------------------------------------------------------

  async function run(action, value) {
    const current = car();
    if (!current || !current.available) return;
    if (PIN_ACTIONS.has(action) && !current.hasPin) {
      showToast(t('Set the remote-control PIN in the device settings first'), true);
      return;
    }
    if (CONFIRM[action] && !(confirm && confirm.action === action && Date.now() < confirm.until)) {
      confirm = { action, until: Date.now() + 3000 };
      showToast(t(CONFIRM[action]));
      render();
      setTimeout(() => { if (confirm && confirm.action === action && Date.now() >= confirm.until) { confirm = null; render(); } }, 3100);
      return;
    }
    confirm = null;
    if (anyPending() && !ADJUSTABLE.has(action)) {
      showToast(t('Wait for the current command to finish'));
      return;
    }
    try { Homey.hapticFeedback(); } catch (err) { /* only allowed right after a touch */ }

    const key = `${current.carId}:${action}`;
    pending.set(key, setTimeout(() => {
      pending.delete(key);
      render();
    }, COMMAND_TIMEOUT_MS));
    if (action === 'flash') flashing = true;
    render();
    try {
      await Homey.api('POST', '/command', { carId: current.carId, action, value });
    } catch (err) {
      finish({ carId: current.carId, action, ok: false, error: err.message || String(err) });
    }
  }

  function finish({ carId, action, ok, error }) {
    const key = `${carId}:${action}`;
    clearTimeout(pending.get(key));
    pending.delete(key);
    if (action === 'flash') flashing = false;
    if (action === 'set_temperature') localTemp = null;
    const seat = action.startsWith('seat_heat_') ? action.slice('seat_heat_'.length) : null;
    if (seat && !seatTimers[seat]) localSeat[seat] = null;
    if (carId === selectedId) showToast(ok ? t(DONE[action] || 'Done') : error || t('Command failed'), !ok);
    render();
  }

  function stepTemperature(delta) {
    const current = car();
    if (!current || !current.available) return;
    const base = localTemp != null ? localTemp : (current.targetTemperature || 22);
    localTemp = Math.min(32, Math.max(16, base + delta));
    render();
    clearTimeout(tempTimer);
    // Wait until the user stops tapping; then one command.
    tempTimer = setTimeout(() => run('set_temperature', localTemp), 1500);
  }

  function stepSeat(seat) {
    const current = car();
    if (!current || !current.available) return;
    const level = localSeat[seat] != null ? localSeat[seat] : (current.seatHeat && current.seatHeat[seat]) || 0;
    const next = (level + 1) % 4;
    localSeat[seat] = next;
    render();
    clearTimeout(seatTimers[seat]);
    // Off → 1 → 2 → 3 → Off; one command once the user stops tapping.
    seatTimers[seat] = setTimeout(() => {
      seatTimers[seat] = null;
      run(`seat_heat_${seat}`, next);
    }, 1200);
  }

  // --- Rendering -------------------------------------------------------------------

  function ago(seconds) {
    if (!seconds) return t('No report yet');
    const minutes = Math.round((Date.now() / 1000 - seconds) / 60);
    if (minutes < 1) return t('Updated just now');
    const no = t('Updated') !== 'Updated';
    const since = (amount, unit) => (no ? `Oppdatert for ${amount} ${unit} siden` : `Updated ${amount} ${unit} ago`);
    if (minutes < 60) return since(minutes, 'min');
    const hours = Math.round(minutes / 60);
    if (hours < 24) return since(hours, no ? 't' : 'h');
    return since(Math.round(hours / 24), 'd');
  }

  function duration(minutes) {
    if (minutes == null) return '';
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    return h ? `${h} h ${m} min` : `${m} min`;
  }

  const fmt = (value, unit, digits = 0) => (value == null ? '–' : `${Number(value).toFixed(digits)}${unit}`);

  // S05 top view, front to the left: the top edge is the car's right side.
  // Coordinates are in the original 1200×750 render; s05.png is its crop at (64, 120).
  const DOOR_SPANS = { front: [400, 645], rear: [680, 890] };
  const WINDOW_SPANS = { front: [470, 650], rear: [682, 912] };

  function carSvg(c) {
    const doors = c.doors || {};
    const windows = c.windows || {};
    const locked = c.locked;
    const busyLock = isPending('lock') || isPending('unlock');
    const confirmUnlock = confirm && confirm.action === 'unlock';
    const lockFill = confirmUnlock ? 'var(--accent)' : locked === false ? 'var(--warn)' : '#1d2530';
    const lockAction = locked === false ? 'lock' : 'unlock';
    const heating = c.targetTemperature != null && c.insideTemperature != null && c.targetTemperature > c.insideTemperature;
    const glow = heating ? 'var(--heat)' : 'var(--accent)';
    const charging = c.chargingState === 'plugged_in_charging';
    const plugged = c.chargingState && c.chargingState !== 'plugged_out';

    const tire = (t, x, y) => `<text class="tire-label${t && t.alarm ? ' alarm' : ''}" x="${x}" y="${y}" text-anchor="middle">${t && t.bar != null ? `${t.bar.toFixed(1)} bar` : '–'}</text>`;
    // Door band along the body edge, and the door drawn swung out from its front hinge.
    const door = (side, span, open) => {
      if (!open) return '';
      const [x1, x2] = DOOR_SPANS[span];
      const top = side === 'right';
      const edge = top ? 163 : 585;
      const band = top ? `M${x1} 158 L${x2} 158 L${x2} 192 L${x1} 192 Z` : `M${x1} 556 L${x2} 556 L${x2} 590 L${x1} 590 Z`;
      return `<path d="${band}" fill="var(--warn)" opacity=".85" mask="url(#car)"/>
        <rect x="${x1}" y="${edge - 7}" width="${x2 - x1}" height="14" rx="7" fill="var(--warn)" transform="rotate(${top ? -24 : 24} ${x1} ${edge})"/>`;
    };
    const glass = (side, span, open) => {
      if (!open) return '';
      const [x1, x2] = WINDOW_SPANS[span];
      const y = side === 'right' ? 188 : 526;
      return `<rect x="${x1}" y="${y}" width="${x2 - x1}" height="35" rx="12" fill="var(--warn)" opacity=".9"/>`;
    };

    return `
    <svg viewBox="0 70 1200 625" class="${c.climateOn ? 'climate-on' : ''} ${flashing ? 'flashing' : ''}" role="img" aria-label="${t('Deepal S05, top view')}">
      <defs>
        <mask id="car" style="mask-type:alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="750">
          <image href="s05.png" x="64" y="120" width="1072" height="510"/>
        </mask>
        <radialGradient id="glow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="${glow}" stop-opacity=".75"/>
          <stop offset="100%" stop-color="${glow}" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0%" stop-color="#ffe8a3" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#ffe8a3" stop-opacity="0"/>
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
          <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".22"/>
        </filter>
      </defs>

      <!-- headlight beams (shown while flashing) -->
      <path class="flash-beam" d="M150 182 L0 120 L0 270 L135 200 Z" fill="url(#beam)"/>
      <path class="flash-beam" d="M150 566 L0 628 L0 478 L135 548 Z" fill="url(#beam)"/>

      <image href="s05.png" x="64" y="120" width="1072" height="510" filter="url(#shadow)"/>

      <!-- state tints, clipped to the car's outline -->
      ${c.hoodOpen ? '<rect x="64" y="120" width="285" height="510" fill="var(--warn)" opacity=".75" mask="url(#car)"/>' : ''}
      ${c.trunkOpen ? '<rect x="945" y="120" width="191" height="510" fill="var(--warn)" opacity=".75" mask="url(#car)"/>' : ''}
      <rect class="cabin-glow" x="380" y="150" width="660" height="450" fill="url(#glow)" mask="url(#car)" style="mix-blend-mode:screen"/>
      ${glass('right', 'front', windows.frontRight)}${glass('right', 'rear', windows.rearRight)}
      ${glass('left', 'front', windows.frontLeft)}${glass('left', 'rear', windows.rearLeft)}
      ${door('right', 'front', doors.passenger)}${door('right', 'rear', doors.rearRight)}
      ${door('left', 'front', doors.driver)}${door('left', 'rear', doors.rearLeft)}
      ${flashing ? '<g fill="#ffd65a"><ellipse cx="170" cy="186" rx="40" ry="9"/><ellipse cx="170" cy="562" rx="40" ry="9"/></g>' : ''}

      <!-- tap areas -->
      <rect class="part" data-action="flash" role="button" aria-label="${t('Flash the lights')}" x="70" y="150" width="270" height="450" rx="60" fill="transparent"/>
      <g class="part" data-action="open_trunk" role="button" aria-label="${t('Open the trunk')}">
        <rect x="945" y="170" width="185" height="410" rx="60" fill="transparent"/>
        ${c.trunkOpen ? `<text class="state-label" x="1035" y="388" text-anchor="middle" style="fill:#fff;font-size:34px">${t('OPEN')}</text>` : ''}
        ${isPending('open_trunk') ? '<circle class="pending-ring" cx="1035" cy="375" r="46" style="stroke-width:9"/>' : ''}
      </g>
      ${c.hoodOpen ? `<text class="state-label" x="210" y="388" text-anchor="middle" style="fill:#fff;font-size:34px">${t('HOOD OPEN')}</text>` : ''}

      <!-- lock badge on the glass roof -->
      <g class="part lock-badge" data-action="${lockAction}" role="button" aria-label="${t(locked === false ? 'Lock' : 'Unlock')} ${t('the car')}">
        <circle cx="735" cy="375" r="62" fill="${lockFill}" stroke="rgba(255,255,255,.85)" stroke-width="5" opacity="${locked == null ? .45 : 1}"/>
        ${busyLock ? '<circle class="pending-ring" cx="735" cy="375" r="76" style="stroke-width:9"/>' : ''}
        <g transform="translate(691 331) scale(3.67)" style="color:#fff">${locked === false ? ICONS.unlock : ICONS.lock}</g>
      </g>

      <!-- charging cable from the rear -->
      ${plugged ? `
        <path d="M1128 330 C1160 330 1165 280 1168 250" fill="none" stroke="${charging ? 'var(--ok)' : 'var(--muted)'}" stroke-width="10" stroke-linecap="round"/>
        <circle cx="1166" cy="214" r="32" fill="${charging ? 'var(--ok)' : 'var(--muted)'}"/>
        <g transform="translate(1144 192) scale(1.83)" style="color:#fff">${ICONS.bolt}</g>` : ''}

      <!-- tire pressures: top row is the right side, bottom row the left -->
      ${tire(c.tires.frontRight, 250, 132)}
      ${tire(c.tires.rearRight, 930, 132)}
      ${tire(c.tires.frontLeft, 250, 668)}
      ${tire(c.tires.rearLeft, 930, 668)}
    </svg>`;
  }

  function render() {
    const app = document.getElementById('app');
    const c = car();
    if (!c) {
      app.innerHTML = `<div style="position:relative;height:420px"><div class="overlay"><div><strong>${t('No car yet')}</strong>${t('Add your car under Devices → + → Changan Deepal (Unofficial).')}</div></div></div>`;
      return;
    }

    const temp = localTemp != null ? localTemp : (c.targetTemperature || 22);
    const heating = c.insideTemperature != null && temp > c.insideTemperature;
    const charging = c.chargingState === 'plugged_in_charging';
    const plugged = c.chargingState === 'plugged_in';
    const low = c.battery != null && c.battery <= 20;
    const busy = anyPending();
    const lockAction = c.locked === false ? 'lock' : 'unlock';
    const windowsAction = c.anyWindowOpen ? 'windows_close' : 'windows_open';

    let chargeText = `${fmt(c.rangeKm, ' km')} ${t('range')}`;
    let chargeClass = '';
    if (charging) {
      chargeClass = 'charging';
      chargeText = [t('Charging'), c.chargeCurrentA ? `${Math.round(c.chargeCurrentA)} A` : null,
        c.chargeTimeRemainingMin != null ? `${duration(c.chargeTimeRemainingMin)} ${t('left')}` : null].filter(Boolean).join(' · ');
    } else if (plugged) {
      chargeText = t('Plugged in');
    }

    const chips = [...c.warnings.map(w => `<span class="chip">${w}</span>`)];
    if (c.anyDoorOpen) chips.push(`<span class="chip info">${t('Door open')}</span>`);
    if (c.anyWindowOpen) chips.push(`<span class="chip info">${t('Window open')}</span>`);

    const action = (name, label, iconName, extra = '') => {
      const classes = ['action', extra];
      if (confirm && confirm.action === name) classes.push('confirm');
      if (isPending(name)) classes.push('pending');
      const disabled = !c.available || (busy && !isPending(name));
      return `<button class="${classes.join(' ')}" data-action="${name}" ${disabled ? 'disabled' : ''} aria-label="${label}">${icon(iconName)}<span>${label}</span></button>`;
    };

    app.innerHTML = `
      <div class="header">
        <div class="title">
          <button class="name ${cars.length > 1 ? 'switchable' : ''}" data-switch>${escapeHtml(c.name)}</button>
          <div class="sub">${c.available ? ago(c.lastUpdated) : t('Unavailable')}</div>
        </div>
        <button class="refresh ${isPending('refresh') ? 'busy' : ''}" data-action="refresh" aria-label="${t('Wake the car and refresh')}" ${!c.available || busy ? 'disabled' : ''}>${icon('refresh')}</button>
      </div>

      <div class="battery">
        <div class="battery-value">${c.battery == null ? '–' : c.battery}<small>%</small></div>
        <div class="battery-detail">
          <div class="bar ${charging ? 'charging' : ''} ${low ? 'low' : ''}"><div style="width:${c.battery || 0}%"></div></div>
          <div class="battery-text"><span class="${chargeClass}">${chargeText}</span><span>${charging || plugged ? fmt(c.rangeKm, ' km') : ''}</span></div>
        </div>
      </div>

      <div class="car-wrap">${carSvg(c)}</div>
      ${chips.length ? `<div class="warnings">${chips.join('')}</div>` : ''}

      <div class="climate ${c.climateOn ? 'climate-on' : ''} ${heating ? 'heating' : ''}">
        <button class="climate-toggle" data-action="${c.climateOn ? 'climate_off' : 'climate_on'}" ${!c.available || (busy && !isPending('climate_on') && !isPending('climate_off')) ? 'disabled' : ''}>
          <span class="climate-icon">${icon('fan')}</span>
          <span style="min-width:0">
            <div class="climate-label">${isPending('climate_on') ? t('Starting…') : isPending('climate_off') ? t('Stopping…') : c.climateOn ? t(heating ? 'Heating' : 'Cooling') : t('Climate off')}</div>
            <div class="climate-sub">In ${fmt(c.insideTemperature, '°', 0)} · Out ${fmt(c.outsideTemperature, '°', 0)}</div>
          </span>
        </button>
        <div class="temp">
          <button data-temp="-0.5" aria-label="${t('Lower temperature')}" ${!c.available ? 'disabled' : ''}>−</button>
          <div class="temp-value">${temp.toFixed(1)}°</div>
          <button data-temp="0.5" aria-label="${t('Raise temperature')}" ${!c.available ? 'disabled' : ''}>+</button>
        </div>
      </div>

      <div class="comfort">
        ${seatButton(c, 'driver', t('Driver'))}
        ${seatButton(c, 'passenger', t('Passenger'))}
        <button class="comfort-btn ${c.steeringWheelHeat ? 'on' : ''} ${isPending('steering_on') || isPending('steering_off') ? 'pending' : ''}"
          data-action="${c.steeringWheelHeat ? 'steering_off' : 'steering_on'}" aria-label="${t('Steering wheel heating')}"
          ${!c.available || (busy && !isPending('steering_on') && !isPending('steering_off')) ? 'disabled' : ''}>
          ${icon('wheel')}
          <span class="comfort-text"><span class="comfort-label">${t('Wheel')}</span><span class="comfort-state">${c.steeringWheelHeat == null ? '–' : c.steeringWheelHeat ? t('On') : t('Off')}</span></span>
        </button>
      </div>

      <div class="actions">
        ${action(lockAction, t(c.locked === false ? 'Lock' : 'Unlock'), c.locked === false ? 'lock' : 'unlock', c.locked === false ? 'alert' : '')}
        ${action('flash', t('Flash'), 'flash')}
        ${action('horn', t('Horn'), 'horn')}
        ${action('open_trunk', t('Trunk'), 'trunk', c.trunkOpen ? 'alert' : '')}
        ${action(windowsAction, t(c.anyWindowOpen ? 'Close' : 'Windows'), 'window', c.anyWindowOpen ? 'alert' : '')}
      </div>

      ${c.available ? '' : `<div class="overlay" style="top:58px"><div><strong>${t('Car unavailable')}</strong>${t('The My Changan login expired or was signed out. Open the device and choose Repair to log in again.')}</div></div>`}
    `;
    syncHeight();
  }

  // Homey keeps the widget hidden until ready(), and a hidden page measures 0 px.
  // So ready() uses the manifest height, and the real height is sent once visible.
  const MIN_HEIGHT = 300;
  let isReady = false;
  let lastHeight = null;
  function syncHeight() {
    if (!isReady || typeof Homey.setHeight !== 'function') return;
    const height = Math.ceil(document.getElementById('app').getBoundingClientRect().height) + 26; // body padding
    if (height < MIN_HEIGHT || height === lastHeight) return;
    lastHeight = height;
    Promise.resolve(Homey.setHeight(height)).catch(() => {});
  }

  function seatButton(c, seat, label) {
    const level = localSeat[seat] != null ? localSeat[seat] : c.seatHeat ? c.seatHeat[seat] : null;
    const bars = [1, 2, 3].map(n => `<i class="${level >= n ? 'on' : ''}"></i>`).join('');
    const pendingSeat = isPending(`seat_heat_${seat}`) || seatTimers[seat];
    return `<button class="comfort-btn ${level > 0 ? 'on' : ''} ${pendingSeat ? 'pending' : ''}" data-seat="${seat}"
      aria-label="${label} ${t('seat heating')}, ${t('level')} ${level == null ? t('unknown') : level}" ${!c.available ? 'disabled' : ''}>
      ${icon('seat')}
      <span class="comfort-text"><span class="comfort-label">${label}</span><span class="levels">${bars}</span></span>
    </button>`;
  }

  function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  let toastTimer = null;
  function showToast(message, isError = false) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = `toast show${isError ? ' error' : ''}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = 'toast'; }, isError ? 4500 : 2200);
  }

  // --- Events --------------------------------------------------------------------

  document.addEventListener('click', event => {
    const target = event.target.closest('[data-action], [data-temp], [data-switch], [data-seat]');
    if (!target || target.disabled) return;
    if (target.hasAttribute('data-switch')) {
      if (cars.length < 2) return;
      const index = cars.findIndex(c => c.carId === selectedId);
      selectedId = cars[(index + 1) % cars.length].carId;
      localTemp = null;
      remember();
      render();
      return;
    }
    if (target.hasAttribute('data-temp')) {
      stepTemperature(Number(target.getAttribute('data-temp')));
      return;
    }
    if (target.hasAttribute('data-seat')) {
      stepSeat(target.getAttribute('data-seat'));
      return;
    }
    const current = car();
    if (current && current.available && busyBlocks(target.getAttribute('data-action'))) {
      showToast(t('Wait for the current command to finish'));
      return;
    }
    run(target.getAttribute('data-action'), target.getAttribute('data-action') === 'climate_on' ? (localTemp != null ? localTemp : current && current.targetTemperature) : undefined);
  });

  function busyBlocks(action) {
    return anyPending() && !isPending(action) && !CONFIRM[action] && !ADJUSTABLE.has(action);
  }

  function remember() {
    try { localStorage.setItem(`deepal-car-${Homey.getWidgetInstanceId()}`, selectedId); } catch (err) { /* optional */ }
  }

  function recall() {
    try { return localStorage.getItem(`deepal-car-${Homey.getWidgetInstanceId()}`); } catch (err) { return null; }
  }

  // Homey calls this once the widget may talk to the app.
  function onHomeyReady(homey) {
    Homey = homey;
    selectedId = recall();
    Homey.on('deepal:state', state => {
      const index = cars.findIndex(c => c.carId === state.carId);
      if (index === -1) cars.push(state); else cars[index] = state;
      render();
    });
    Homey.on('deepal:command', finish);
    load().then(() => {
      Homey.ready();
      isReady = true;
      // Layout settles over a few frames after Homey reveals the widget.
      requestAnimationFrame(() => setTimeout(syncHeight, 50));
      setTimeout(syncHeight, 1000);
      if (window.ResizeObserver) new ResizeObserver(syncHeight).observe(document.getElementById('app'));
    });
    setInterval(load, 60000);
    // Keep "updated x min ago" current between reports.
    setInterval(render, 30000);
  }
  window.onHomeyReady = onHomeyReady;
</script>
</body>
</html>
